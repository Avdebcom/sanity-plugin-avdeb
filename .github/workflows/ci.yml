name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm pack --dry-run

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the dev Studio with the plugin
        working-directory: studio
        env:
          SANITY_STUDIO_PROJECT_ID: ci000000
        run: |
          ln -sfn ../node_modules node_modules
          ln -sfn .. ../node_modules/sanity-plugin-avdeb
          ../node_modules/.bin/sanity build --yes
          test -f dist/index.html
